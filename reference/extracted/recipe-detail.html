 CANDIED NUTS: \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eIn a saucepan, dry roast mixed nuts for 1 minute.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eAdd brown sugar, cinnamon, sea salt, and honey.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eToss for 1 minute until sugar is dissolved, coating the nuts evenly.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eFOR SOURDOUGH TOAST:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eHeat a nonstick pan and place the sourdough slices on it.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eDrizzle olive oil and toast until golden and crisp. Set aside.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eFOR WHIPPED AVOCADO:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eIn a blender jar, combine ripe avocado, cream cheese, salt, and a dash of lemon juice.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eSlowly add olive oil to the blender on high speed until the mixture is smooth and creamy.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eASSEMBLING THE WHIPPED AVOCADO TOAST:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eSpread the whipped avocado mixture on toasted sourdough slices.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eTop each slice with sliced cherry tomatoes and scatter candied nuts generously.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eDrizzle with balsamic glaze and serve. \u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"21:[\"$\",\"div\",null,{\"className\":\"relative scroll-smooth\",\"aria-label\":\"recipes details\",\"children\":[[\"$\",\"div\",null,{\"className\":\"h-144 w-full md:h-192.5\",\"children\":[\"$\",\"$L38\",null,{\"src\":\"https://vimeo.com/906278351?share=copy\",\"fullscreen\":false,\"autoplay\":true}]}],[\"$\",\"div\",null,{\"className\":\"mx-auto lg:max-w-7xl lg:px-2 px-0\",\"children\":[[\"$\",\"$L39\",null,{\"imageUrl\":\"no_selection\",\"recipeName\":\"Whipped Avocado Toast \",\"cookingTime\":\"30 minutes \",\"cuisine\":\"American\",\"author\":\"By Team Foodstories\",\"shortDescription\":\"$undefined\",\"recipe\":{\"id\":363,\"sku\":\"whipped-avocado-toast\",\"name\":\"Whipped Avocado Toast\",\"attribute_set_id\":11,\"price\":0,\"status\":1,\"visibility\":4,\"type_id\":\"virtual\",\"created_at\":\"2023-12-21 12:26:07\",\"updated_at\":\"2026-07-31 10:50:28\",\"extension_attributes\":{\"website_ids\":[1,2,3,4,5,6,7],\"category_links\":[{\"position\":69,\"category_id\":\"425\"},{\"position\":1,\"category_id\":\"2647\"}],\"attribute_set_name\":\"recipes\",\"nutrition
