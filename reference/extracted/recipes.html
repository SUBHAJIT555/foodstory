 and place on a paper towel to absorb any excess oil. Serve hot.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e3f:T442,\u003cp\u003e\u003cstrong\u003eFor the Makhni:\u003c/strong\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003ePressure cook tomatoes, garlic, ginger, green cardamoms, mace, one cup water, red chili powder and butter for 3 whistles. Let the pressure release completely and open the lid. Let the tomatoes cool down for 10-15 minutes.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eAdd salt and mix well. Blend the gravy to a fine purée, strain into another deep pan and cook for 5 minutes.  \u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eAdd dried fenugreek powder and honey, cook for 2-3 minutes more. Add the cream and garam masala powder, mix lightly. Keep warm.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003cp\u003e\u003cstrong\u003eFor the Assembly:\u003c/strong\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eTake a serving plate and pour makhani sauce, arrange the  mozzarella pieces on the sauce. Garnish it with fresh cream and dried fenugreek powder, serve hot.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e40:T6f8,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003eFor the Soup:\u003c/strong\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eChop the woody part of the stem of asparagus. Then peel 2 asparagus lengthwise and chop the remaining asparagus. Blanch the peeled asparagus in boiling salted water for one minute. Drain and refresh in cold water.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eHeat butter and olive oil in a deep pan, add garlic and onions, saute until the onions are translucent. \u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eAdd asparagus and saute for a minute. Then add refined flour and saute for 2-3 minutes.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eAdd stock and boil for 5-6 minutes or until the asparagus is tender. Then blend the soup to a fine puree.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eStrain the soup in another deep pan. Add milk and season with white pepper powder. Simmer for 2-3 minutes. Just before serving add cream and simmer for another 2-3 minutes.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003cp\u003e\u003cstrong\u003eFor the Lavash:\u003c/strong\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eTake oil, chili, parsley and garlic in a bowl. Brush this on the lavash and gratinate it in a preheated oven for 1-2 minutes at 180℃.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\u003cp\u003e\u003cstrong\u003eFor the Serving:\u003c/strong\u003e\u003c/p\u003e\r\n\u003col\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eTake a serving bowl and add in a portion of the blanched asparagus in the bowl. Then add a portion of piping hot soup. Garnish with a swirl of cream and serve with lavash.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"37:[\"$\",\"div\",null,{\"className\":\"flex w-full flex-col-r
