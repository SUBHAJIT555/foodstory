ript>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"When will I receive my order?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"At the time of placing your order, we give our customers the option to choose the day and time slot when they would like to receive their order. Notwithstanding any unforeseen circumstances, we make every effort to deliver your order within the time slot chosen by you. You can always check the status of your order in the Order History section of our website\"}},{\"@type\":\"Question\",\"name\":\"Can I cancel or modify my order?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"You may cancel your order for up to 15 minutes from the time of placing your order by reaching out to our team on +91 90041 71401 or from the Order History section of our website.\"}},{\"@type\":\"Question\",\"name\":\"What do I do if I have a complaint about my order?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Please reach out to our team by sending an email on care@foodstories.shop or contacting us via WhatsApp on +91 90041 71401. To speak with our customer care team, you may also call us on +91 90041 71401.\"}},{\"@type\":\"Question\",\"name\":\"How do I see the invoice for my order?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"An electronic copy of your invoice is sent on WhatsApp and via Email along with every order. You may also download a copy of your invoice by visiting the Order History section of our website.\"}},{\"@type\":\"Question\",\"name\":\"What if I’m unable to find the product I want on your website?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Certain products may not be listed on our website; in case you are unable to find your desired product on our website, please contact our store directly. You may view our store’s contact information by clicking here.\"}},{\"@type\":\"Question\",\"name\":\"How do I check the status of my order?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"You may check the status of your order in the Order History section of our website. Alternatively, you may contact us via WhatsApp on +91 90041 71401. To speak with our customer care team, you may also call us on +91 90041 71401.\"}},{\"@type\":\"Question\",\"name\":\"How can I order with FoodStories?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"We offer multiple ways for you to order with FoodStories. You can order via our website www.foodstories.shop. You may also WhatsApp us on +91 90041 71401 to place an order or you can visit your nearest FoodStories store to shop what you need.\"}},{\"@type\":\"Question\",\"name\":\"Can I have my order delivered to multiple locations?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"At the moment we are only able to deliver one order to one delivery address. If you wish to have items delivered to multiple locations, please place individual orders for each delivery location.\"}},{\"@type\":\"Question\",\"name\":\"How can I return or exchange my order?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"To return a product, please visit the FoodStories store from where you made your purchase along with an original invoice as proof of purchase. If you wish to exchange certain items from your order, please contact us via WhatsApp on +91 90041 71401 and our team will be happy to help you. You may view our policy here.\"}},{\"@type\":\"Question\",\"name\":\"What are the store timings?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Please view our Store Directory for the operating hours of each FoodStories store.\"}},{\"@type\":\"Question\",\"name\":\"How do I contact/ find the store?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Please view our Store Directory for the location and contact information of each Foodstories store.\"}},{\"@type\":\"Question\",\"name\":\"Can I have someone pick up my order?\",\"acceptedAnswer\":{\"@type\":\"Answ  that your token of appreciation comes straight from the heart. To ensure that you enjoy gifting your way, we offer Bespoke Gifting services for all orders, where you can pick your favourites - from the ingredients in the basket all the way down the ribbon and note card being added.\"}},{\"@type\":\"Question\",\"name\":\"Do you offer healthy gift hamper options?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, we can curate gift hampers with a variety of guilt-free and healthy delights as per your preference. You may also browse our selection of Gluten Free hampers.\"}},{\"@type\":\"Question\",\"name\":\"Where all can you deliver gift hampers?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"We’re currently delivering hampers across Delhi NCR, Hyderabad and Bengaluru. To check if we can deliver to your location, please enter your delivery pin code on our checkout page.\"}},{\"@type\":\"Question\",\"name\":\"Can I add a note to the gift hamper?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, you can add a note to your gift hamper while shopping online, just before adding it to your cart. You can also reach out to our gifting experts at our store or WhatsApp at 900417140 and they’ll be happy to add a personalised, handwritten note to your hamper.\"}},{\"@type\":\"Question\",\"name\":\"Do you curate hampers for weddings?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, we have a number of pre-curated hampers that are perfect for wedding gifting, in-room hampers, bridal showers and bachelorette parties. You may also customise your own by filling in our Gifting Personalisation form on the website.\"}},{\"@type\":\"Question\",\"name\":\"How much time do you take to deliver a gift hamper?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Choose the time slot and delivery date based on your preference while ordering a hamper online and we’ll have it delivered at your doorstep.\"}}]}"])</script><script>self.__next_f.push([1,"63:[\"$\",
