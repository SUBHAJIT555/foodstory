xt/static/chunks/50e98b9e352c7576.js\",\"/_next/static/chunks/d185844b646d81fe.js\",\"/_next/static/chunks/5bcf1dde9b8a1cd2.js\",\"/_next/static/chunks/006fdded16af65a1.js\",\"/_next/static/chunks/9f3ab985b44f63d9.js\",\"/_next/static/chunks/ce818783d979a383.js\",\"/_next/static/chunks/4eab0f62704c5aa1.js\",\"/_next/static/chunks/47979c888f9a50ce.js\",\"/_next/static/chunks/19a3236fec90270b.js\",\"/_next/static/chunks/2c1fab37bed25f3f.js\",\"/_next/static/chunks/165eb5403f44526b.js\"],\"default\"]\n60:T1724,"])</script><script>self.__next_f.push([1,"\u003cdiv style=\"max-width: 100%; margin: 0 auto; padding: 20px; font-family: 'Gilroy', Arial, sans-serif; color: #555; line-height: 1.6;\"\u003e\r\n\u003ch2 style=\"font-size: 24px; margin-bottom: 20px; margin-top: 40px; color: #333; font-weight: bold;\"\u003eChocolate \u0026amp; Sweets Hampers - Pure Indulgence Delivered\u003c/h2\u003e\r\n\u003cp style=\"font-size: 16px; margin: 0 0 20px 0;\"\u003e\u003cstrong\u003e\u003ca href=\"https://www.foodstories.shop/gifting/all-gifts/gifts-by-type/chocolate-sweets\" target=\"_blank\" rel=\"noopener\"\u003eChocolate \u0026amp; Sweets hamper\u003c/a\u003e\u003c/strong\u003e is a medium that communicates to everyone and every occasion in every relationship. A well-put-together box of chocolate says it all when words don't. The team at \u003cstrong\u003e\u003ca title=\"Explore Foodstories - The Premium Gourmet Grocery Store \" href=\"https://www.foodstories.shop/\" target=\"_blank\" rel=\"noopener\"\u003eFoodstories\u003c/a\u003e\u003c/strong\u003e understands that the right sweet gesture can strengthen relationships, create lasting memories and tell someone how much they mean to you.\u003c/p\u003e\r\n\u003cp style=\"font-size: 16px; margin: 0 0 20px 0;\"\u003e\u003cstrong\u003e\u003ca title=\"Explore Our Curated Gourmet Hamper Collection\" href=\"https://www.foodstories.shop/gifting/all-gifts/\" target=\"_blank\" rel=\"noopener\"\u003eOur curated gourmet hamper collection\u003c/
