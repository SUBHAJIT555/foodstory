00;\"\u003eGone are the days when a tiny umbrella on a cocktail glass signified the heights of creative mixology. From Van Gogh inspired artwork to mini desserts—like a slab of dark chocolate—to candy floss inspired foam, cocktail garnishes are becoming the veritable works of art, standing for a bartender’s ingenuity behind the counter. \u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003e\u003cbr /\u003e\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003e\u003cbr /\u003e\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eSo how do you incorporate this trend for your next home party? We asked \u003ca title=\"Rakshay Dhariwal - LinkedIn Profile\" href=\"https://in.linkedin.com/in/rakshay-dhariwal-23245531\" target=\"_blank\" rel=\"noopener\"\u003e\u003cstrong\u003eRakshay Dhariwal\u003c/strong\u003e\u003c/a\u003e for some tips. Dhariwal is the genius behind some of India’s best and most cutting-edge bars like PCO and Saz and concepts such as India Cocktail Week, a festival dedicated only to cocktails. Most recently, Dhariwal launched Pistola, India’s first premium agave spirit. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eWhile studying \u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eMarketing \u0026amp; Telecom at Indiana University, Dhariwal loved entertaining and constantly hosted parties at home. These parties, he says, sowed the seeds of his entrepreneurial journey by teaching him the basics of operating and running a bar. “When I moved back to India in 2007, I noticed that the cocktail culture in India was still very nascent. Most people did not understand what cocktails really were. It was all about syrupy, colourful, sugary drinks. That is when I realised that the real gap in the market was in showcasing classic, prohibition and pre-prohibition cocktails to consumers,” he says. And thus was born PCO, a bar that took the capital by storm. In a freewheeling conversation about his journey, cocktail making and his favourite drinks, Dhariwal shares his tips for hosting the ultimate home party with the best drinks. Read on for more: \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"87:T857,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003e“I’m not a businessman”, says the founder of Keggs.\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003e At 90 years of age, he stills comes to work- sitting in a leather chair in his office that's teeming with books and a soft, calming, rosy fragrance. He regales with stories about the different types of eggs he's encountered in all the fanciest of places around the country all while humbly discussing his work; the 'egg'volution that he pretty much single-handedly brought in, in India.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eThe idea for Keggs was hatched by Vinod Kapur long before, even before India got its independence. While Mr.Kapur was wading through the corporate world, his entrepreneurial spirit led him away from the corporate ladder and towards a venture he wanted to call his own. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eBut why an \u003c/span\u003e\u003cem\u003e\u003cspan style=\"font-weight: 400;\"\u003eegg\u003c/span\u003e\u003c/em\u003e\u003cspan style=\"font-weight: 400;\"\u003e? Because he was always on the lookout for a good fried egg, sunny side up. Simple. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eHe’s travelled to 5-star, 7-star hotels and lunched with the bigwigs of the hospitality industry. He’s seen fried eggs being served with a blood-orange yolk or a limp, flat yellow-ed yolk. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003eFoodstories currently offers a limited stock of KEGGS eggs in three different varieties: \u003cstrong\u003e\u003ca title=\"Order Keggs Cage Free Tan Eggs Online\" href=\"https://www.foodstories.shop/shop/product/keggs-cage-free-tan-eggs/\" target=\"_blank\" rel=\"noopener\"\u003eKeggs Cage Free Tan Eggs\u003c/a\u003e\u003c/strong\u003e for a pack of 6, \u003cstrong\u003e\u003ca title=\"Order Keggs Cage Free Brown Eggs Online\" href=\"https://www.foodstories.shop/shop/product/keggs-cage-free-brown-eggs/\" target=\"_blank\" rel=\"noopener\"\u003eKeggs Cage Free Brown Eggs\u003c/a\u003e\u003c/strong\u003e at for a pack of 6, and \u003cstrong\u003e\u003ca title=\"Order Keggs Cage Free Authentic Kadaknath Eggs Online\" href=\"https://www.foodstories.shop/shop/product/keggs-cage-free-authentic-kadaknath-eggs/\" target=\"_blank\" rel=\"noopener\"\u003eKeggs Cage Free Authentic Kadaknath Eggs\u003c/a\u003e\u003c/strong\u003e for a pack of 6.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"88:T660,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003eAnd what’s the one egg myth that can be cracked open?\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003e“You can leave your eggs out or refrigerate them.” Doesn’t it matter how long we can keep it? “Nutritionally, there’s not much difference between the eggs you keep outside and refrigerate. It always comes down to the yolk, because that’s where the taste lies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eIt’s true. When making fresh pasta, the colour of your dough depends upon the egg and the egg yolk being used. So your spaghetti carbonara or fettuccine alfredo can look inviting or unappealing depending on the yolks one uses. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eWhy Keggs?\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eThe brand may have started because of a passion for eggs but it is confidently led by Mr.Kapur’s principles. He ensures that the chickens that lay the iconic, tan-coloured Keggs eggs are free range chicken, meaning they have plenty of greenery to be in, a healthy feed and a cruelty-free lifestyle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eHe invests and ensures that the chickens that lay the metaphorical-golden eggs for him, have a good quality of life. It is only when the chickens are well-fed, well looked after and stress-free that you get a nutritionally balanced, high quality egg.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWhich is why he and his wife always said, “Don’t \u003cstrong\u003e\u003ca title=\"Buy Eggs Online\" href=\"https://www.foodstories.shop/shop/eggs-seafood-meats/eggs/\" target=\"_blank\" rel=\"noopener\"\u003ebuy eggs\u003c/a\u003e\u003c/strong\u003e, buy Keggs”!\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"89:T40a,\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWhether you're a devoted chocophile or a casual enthusiast, you would agree that \u003ca title=\"Buy Chocolate From Foodstories\" href=\"https://www.foodstories.shop/shop/chocolates-confectionery/chocolate/\" target=\"_blank\" rel=\"noopener\"\u003echocolate\u003c/a\u003e can completely transform your mood. It can transport you to a different place, much like music or any art form. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eNot convinced? Take it from one of the best chocolate maestros in the country, chef Prateek Bakhtiani. Heading the Mumbai-based chocolaterie Ether Atelier, he uses 100% single-origin chocolate from around the world to encapsulate his experiences and share it with others. For instance, he created the BUTTER bar with Dominican milk-dark chocolate, to capture the incredibly nostalgic and comforting perfume of butter popcorn at the cinema. Bhaktiani’s inspiration was his younger self: when he was the little boy who would demolish a tub of popcorn even before the movie started. \u003c/span\u003e\u003c/p\u003e8a:T5e3,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cem\u003e\u003cstrong\u003eMost importantly: Balance is key.\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eChef Bakhtiani emphasises that there is no such thing as right or wrong chocolate as much as it is about balanced chocolate. The smell, aroma, and taste of good quality chocolate should feel like a balanced symphony of flavours. The flavour should be multi-layered, with notes of different ingredients, nuts, and spices coming through. Even the percentage of cocoa contributes towards the balanced taste. Milk chocolate generally has 30% cocoa whereas dark chocolate has over 45% cocoa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003eDoes the source of the chocolate matter?\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWhen sourcing his chocolate for a new collection, chef Bakhtiani isn’t looking at a particular country’s chocolate because he thinks it’s superior to the rest; he looks for a particular flavour profile. Ether sources chocolate from India as well. He feels highly optimistic and excited about India’s future in the chocolate game. He observes that the agriculture of cocoa beans is still in its growth phase so its cocoa beans aren’t as refined as in other countries which preserves its nuances and notes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eAt the end of the day, Chef Prateek Bakhtiani strongly suggests that people should enjoy whatever chocolate makes them feel happy. “If you enjoy premium chocolate, go for it. If you enjoy Cadbury, you should eat that.”\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"8b:T620,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003e“If we take a little effort to understand koji, I think we will start appreciating what it can bring to our food. It goes beyond simply blending local ingredients or creating fusion dishes; it's about unlocking a treasure trove of flavours, nutrition, and an enhanced eating experience,” says Prachet Sancheti about the food that fuels him in more ways than one. Having launched his business dedicated to koji, in late 2021, \u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eSancheti has been promoting the wonders of this ingredient traditionally used in Japanese cuisine, ever since.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eFor the uninitiated, koji is a culture prepared by growing the sporulating mould called \u003c/span\u003e\u003cem\u003e\u003cspan style=\"font-weight: 400;\"\u003eAspergillus oryzae\u003c/span\u003e\u003c/em\u003e\u003cspan style=\"font-weight: 400;\"\u003e on cooked grains such as rice or soybeans in warm and humid conditions. Several seasonings and condiments such as miso pastes, soy sauce, mirin and sake are made with grains inoculated with koji. But for Sancheti, the real fun began when he introduced koji to Indian ingredients like chana dal, Goan cashews and black rice\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003e. The result has been an exclusive range of products that celebrate the diversity of Indian produce through a fusion of both traditional and modern Asian fermentation techniques. In a freewheeling chat, Sancheti shares why India should care about koji and explains how to use this ingredient that has some of India’s top chefs in raptures.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"8c:T47c,\u003cp\u003e\u003cstrong\u003eWhat about koji do you find so fascinating?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eKoji is a key ingredient in the production of various Japanese staples like soy sauce, miso, and sake. The fascinating aspect of koji lies in its versatility and transformative abilities in fermentation. Koji, typically Aspergillus oryzae, is a mould that plays a crucial role in breaking down complex carbohydrates and proteins into simpler compounds. This enhances the final product's flavours and contributes to the development of unique textures and aromas. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eKoji’s enzymatic action not only ferments the base ingredients but also imparts complex umami flavours. The precision and control one can achieve with koji fermentation makes it a cornerstone in non-traditional creations, offering a canvas for innovation in the realm of fermented foods like your non-traditional soy sauces and misos. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eKoji can also work wonders in combating food waste—it can transform overlooked or surplus ingredients into valuable, flavourful products.\u003c/span\u003e\u003c/p\u003e8d:T675,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003eTell us about your experiments with koji on Indian produce. What does koji bring to our food?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eKoji is a culinary powerhouse and as a result, so are the products that are fermented from it. Irrespective of cuisine, if one understands its complexities, nuances and rich flavours, it can become a seamless ingredient in your pantry. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe work with a fairly large variety of grains and pulses. Chana Dal is ‘koji-fied’ along with Foxtail poha to create our non-soy ‘Soy Sauce’. It’s got great earthiness and a beautiful aroma. We will be ageing this in a Whiskey Oak Barrel soon and are very excited about this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe work with Pahadi Black Soybeans to create amazingly complex fruity misos as well as a tingling spice paste using smoked and dried king chilli. What we get is a meaty paste that is absolutely lip-smacking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eMung Dal and White Watana are the base of our Aged Peaso, which is honestly one of my favourite Misos from the range. It ages well and has nice undertones that make it stand apart from soybean-based misos\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe use different rice to make amazake, a traditional Japanese drink, as well as no-sugar caramels and syrups. While this is not new, the possibilities are just far too many. We also ferment paneer with koji to create an interesting Roquefort or blue cheese-type paste. Local Goan Cashews feature in our best-selling miso paste, the Cashew and Black Garlic variant.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"8e:T503,\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eThe first sip of coffee is the one that can make or break your day. The perfect concoction of a well-brewed cuppa joe is something that we all crave. But how can you ensure you have the perfect cup of coffee all the time, every time? Can you tell if your coffee beans are perfectly roasted, or are they roasting your morning?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cbr /\u003e\u003cspan style=\"font-weight: 400;\"\u003eFret not, for we’ve asked coffee expert \u003cstrong\u003e\u003ca title=\"Yahvi Mariwala - Instagram Profile \" href=\"https://www.instagram.com/yahvimariwala/\" target=\"_blank\" rel=\"noopener\"\u003eYahvi Mariwala\u003c/a\u003e\u003c/strong\u003e, a third-generation coffee roaster for all the tips and tricks to brew that morning juice! Yahvi is one half of the sister duo that runs the Kodaikanal-based \u003cstrong\u003e\u003ca title=\"Nandan Coffee Website \" href=\"https://www.nandancoffee.com/\" target=\"_blank\" rel=\"noopener\"\u003eNandan Coffee\u003c/a\u003e\u003c/strong\u003e, which is helping \u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003ebring high-quality Indian coffee to the forefront of the global coffee marke\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003et. \u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eIn conversation with the Foodstories team, Yahvi shares details on how she got into the family business and the art of creating that stellar sip.\u003c/span\u003e\u003c/p\u003e8f:T4dd,\u003cp\u003e\u003cem\u003e\u003cstrong\u003eBefore we get swayed by a delicious coffee smell, could you please tell us a little bit about yourself? How did you decide to get into the coffee business?\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eKodaikanal, where the Nandanvan Coffee Estate is, has always been an extremely special place to me. Looking back I’ve always been extremely passionate about the environment, and about working with people, and of course, I love coffee.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eAfter college, I was at a crossroads and spent a few days during this time at Nandanvan. At that point, it was driven entirely by passion to create an amazing product with integrity. I spent a lot of time understanding the growing and roasting process and decided then that I wanted to work on this legacy product. Having joined Nandan coffee four years ago, I’ve had more of an entrepreneurial approach where I get to work with so many different people. Whether that’s interactions with the farmers or chats with estate caretakers who help pick out the ripe beans or understanding the end consumer, no two days are the same. For me, it’s a unique position as I’m working on a passion project with a legacy behind it.\u003c/span\u003e\u003c/p\u003e90:T6c3,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cem\u003e\u003cstrong\u003eNow for the tastings!\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003e \u003c/span\u003e\u003cstrong\u003eMost of us know that there are four types of coffee roasts - light, medium, medium-dark and dark. But are there more types of coffee roasts as well? What are the tasting notes we should look out for when we pick a roast?\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eCoffee has a lot of nomenclature but the four mentioned here - light, medium, medium-dark and dark, are broadly speaking, the four different types of roasts; these might also be known by different names in different places as well. Within roasts, we also have the bean variety which helps define the coffee, for example, arabica, robusta, etc. Each variety then yields its own flavours and varieties. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eCoffee in this way is a lot like wine, where it’s not just red or white but wines that offer different flavours and notes; where the grapes have been harvested at different times and regions and can impact the tasting notes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eSo when picking out a roast, you’ll need to understand their flavour profiles first.. For instance, light roasts are more fruity, earthy, and bright or they can be green and earthy as well. Medium roasts on the other hand will offer fruity but more milky, chocolate-y, sweetish notes. Then we have medium-dark roasts which offer more caramelised and cocoa notes and then there’s a dark roast, which can be a bit of an acquired taste. Some dark roasts will offer smoky notes, and some really good dark roasts might \u003c/span\u003e\u003cem\u003e\u003cspan style=\"font-weight: 400;\"\u003enot\u003c/span\u003e\u003c/em\u003e\u003cspan style=\"font-weight: 400;\"\u003e give smoky notes.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"91:T50f,\u003cp\u003e\u003cem\u003e\u003cstrong\u003eBy now we’ve figured out what we want our coffee to taste like. But what should our coffee \u003c/strong\u003e\u003cstrong\u003enot\u003c/strong\u003e\u003cstrong\u003e taste like? For example, how can we tell if our coffee is not well-roasted, or we’ve got the wrong roast?\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eA few important parameters you can look out for are the amount of coffee, the water temperature, how long to brew it and how much pressure is applied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eFor instance, in a coffee shop, a very easy tell is to look at the time it takes, from the time the person touches the coffee machine button to the time the final cup comes out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eIf it takes only six to seven seconds, your coffee will taste very sour and sometimes a little bitter. More than 30 seconds and you’ll end up with a really bitter coffee, because if it’s made really fast then that means the coffee is not getting enough time with the water to extract the full flavour and you’ll get really harsh, sharp notes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eAnd if it takes too long with water? That means you’ve missed that sweet spot when the coffee is brewed perfectly. So your biggest tell is always time.\u003c/span\u003e\u003c/p\u003e92:Ta06,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eFinally, which is your favourite coffee-making tip you’d recommend to us?\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eMy favourite tip is to make sure that you have a cleansed palate when you have coffee. If you have eggs for breakfast and then take a sip of your coffee that would change the way you taste your coffee, so it’s great to have a sip of chilled water and then have your coffee and you’ll see the way the coffee changes based on what you’ve had before it and how you’re experiencing your coffee. \u003c/p\u003e\r\n\u003cp\u003eAnother tip would be to explore different coffees because the coffee industry has a lot to offer, there’s a lot of work that goes into making coffee and it is meant to be enjoyed! We in the industry take it seriously but as a consumer, it’s good to just enjoy what you enjoy and savour it well.\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003eBring the Nandanvan Estate home — browse all five signature roasts, including the best-selling Royale and Espresso blends, right here on Foodstories.\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e\u003ca title=\"Buy Nandan Coffee – Royale (Dark Roast, Ground Beans)\" href=\"https://www.foodstories.shop/shop/product/nandan-coffee-royale-dark-roast-ground-beans/\" target=\"_blank\" rel=\"noopener\"\u003eNandan Coffee – Royale (Dark Roast, Ground Beans)\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e\u003ca title=\"Buy Nandan Coffee – Royale (Light Medium Roast, Ground Beans)\" href=\"https://www.foodstories.shop/shop/product/nandan-coffee-organic-roasters-royale/\" target=\"_blank\" rel=\"noopener\"\u003eNandan Coffee – Royale (Light Medium Roast, Ground Beans)\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e\u003ca title=\"Buy Nandan Coffee – South Special Coffee (Medium Dark Roast, Ground Beans) - Foodstories\" href=\"https://www.foodstories.shop/shop/product/nandan-coffee-south-special-medium-dark-roast-coffee/\" target=\"_blank\" rel=\"noopener\"\u003eNandan Coffee – South Special Coffee (Medium Dark Roast, Ground Beans)\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e\u003ca title=\"Nandan Coffee – Espresso (Medium Roast, Ground Beans) - Foodstories\" href=\"https://www.foodstories.shop/shop/product/nandan-coffee-espresso-medium-roast/\" target=\"_blank\" rel=\"noopener\"\u003eNandan Coffee – Espresso (Medium Roast, Ground Beans)\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e\u003ca title=\"Buy Nandan Coffee – Royale (Dark Roast, Whole Beans)\" href=\"https://www.foodstories.shop/shop/product/nandan-coffee-royale/\" target=\"_blank\" rel=\"noopener\"\u003eNandan Coffee – Royale (Dark Roast, Whole Beans)\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003eThe next time you’re browsing the shelves at Foodstories, stop to literally smell the Nandan Coffee experience at our Brew Bar.\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"93:T554,\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eHow did it all begin?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eIt was honestly my children who had started working out at that point and were on diets that were high in protein. They came up to me one day after gym and asked if there was any way I could make a dessert with whey protein in it so they can consume it better. I’ve always been a good cook so I immediately took this up as a culinary challenge. I decided to make some home-made ice cream with whey protein added to it and Get-A-Way(Get-A-Whey at that time) was born. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eHow did you convince customers that this dessert was actually good for them?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eIt was extremely hard to convince people how an ice cream can be healthy. At first, we got our friends and family to try them. They were all surprised how an ice cream with zero added sugar can taste so good! With customers, it’s been a long journey. Honestly, it was about educating them about ingredients, how protein is important in your diet and so on. In the first 3 months of starting the business, people tried our ice creams and loved it so much they recommended to their peers too. Over time, the business grew by word of mouth and because of the quality of the product.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e94:T526,\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eHow did you go about developing the product and perfecting the ice cream recipes? It must have been challenging to balance protein with yumminess of an icecream!\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eIt started off as a kitchen experiment but when we decided this needs to be taken to the market is when we started thinking on the manufacturing level. We got a food technologist on board to help us get the nutrition right and ensure we don’t compromise on our home-made recipe. With no sugar, it was an even bigger challenge to ensure sweetness of the ice cream. It took a lot of iterations and about 6 months of R\u0026amp;D to finally get it right.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eWhy should people incorporate more protein into their diet?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eProtein is the building-block for our bodies. To maintain or increase the strength in our bodies, we all need to consume more protein. Each person should have about 0.8-1 g of protein per kg of their body weight. It helps the body repair cells and grow new ones. Most of the vegetarians in India are 60-70% devoid of this protein. Most people don’t realise that protein can help them feel fuller for longer, thus aiding weight loss.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e95:T4f3,\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eThe Indian diet allows for consumption of protein via legumes and dals. Why would someone need a product like Get a Way?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eWhile there are a variety of sources for protein in the Indian diet, it is not enough. To give you an example, a bowl of dal is 5 to 10g of protein. So even if you eat three to four  bowls of dal (which isn’t possible for a normal person), you still won’t meet your daily protein requirement of 50-60g per day. Get-A-Way is an add on to your daily diet, where you can get 10-14g of protein per 125ml tub of ice cream and still enjoy eating a dessert. It is not an either or situation but more to compliment your existing eating patterns.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eTell us about running a business with your children. How has the experience been? How has your relationship evolved as a result of it?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eIt has been a phenomenal experience. I learn so much from them every day. It has helped me open up my avenues to generational ideologies and new ways of getting things done. Our relationship has only strengthened since we started doing business together. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e96:T4ce,\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eHow did being on Shark Tank impact the business?\u003cbr /\u003e\u003c/strong\u003e\u003cspan styl"])</script><script>self.__next_f.push([1,"e=\"font-weight: 400;\"\u003eOur appearance on Shark Tank India was a huge success story for us. It gave us the avenue to get our story out there, educate people about our product and with three sharks backing us with funding, it gave us huge credibility as a homegrown brand. The six months that followed after the episode was aired were brilliant in terms of sales for us and the growth trend continued as our success story was aired in season two again.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eWhat plans for the future? What can we look forward to?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe are looking to build a lot more categories in the health space. We love desserts ourselves and really want to build in more products that are healthier than the ones we eat in the market. We have recently added pastries which are 50% less in sugar, ice cream bars which are just 100 calories and cheesecakes which have zero sugar and are keto friendly. We are also looking to expand beyond current geographies and reach to people in all parts of India with our innovative products.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e97:T66a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003e\u003cem\u003eExplore Get A Way’s range of products here.\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003eFrom decadent chocolate to fruity keto picks, each one’s packed with protein, minus the guilt. Take your pick:\u003cbr /\u003e\u003cbr /\u003e\u003cem\u003e\u003cstrong\u003e\u003ca title=\"Buy Get-A-Way Belgian Chocolate Ice Cream - Foodstories\" href=\"https://www.foodstories.shop/shop/product/get-a-way-belgian-chocolate-ice-cream/\" target=\"_blank\" rel=\"noopener\"\u003eGet-A-Way Belgian Chocolate Ice Cream\u003c/a\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e\u003ca title=\"Buy Get-A-Way Chocolate Brownie Fudge Ice Cream - Foodstories\" href=\"https://www.foodstories.shop/shop/product/get-a-way-chocolate-brownie-fudge-ice-cream/\" target=\"_blank\" rel=\"noopener\"\u003eGet-A-Way Chocolate Brownie Fudge Ice Cream\u003c/a\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e\u003ca title=\"Buy Get-A-Way Keto Friendly Blueberry Cheesecake Ice Cream - Foodstories\" href=\"https://www.foodstories.shop/shop/product/get-a-way-keto-friendly-blueberry-cheesecake-ice-cream/\" target=\"_blank\" rel=\"noopener\"\u003eGet-A-Way Keto Friendly Blueberry Cheesecake Ice Cream\u003c/a\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e\u003ca title=\"Buy Get-A-Way Keto Friendly Very Berry Ice Cream - Foodstories\" href=\"https://www.foodstories.shop/shop/product/get-a-way-keto-friendly-very-berry-ice-cream/\" target=\"_blank\" rel=\"noopener\"\u003eGet-A-Way Keto Friendly Very Berry Ice Cream\u003c/a\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e\u003ca title=\"Buy Get-A-Way Alphonso Mango Ice Cream - Foodstories\" href=\"https://www.foodstories.shop/shop/product/get-a-way-alphonso-mango-ice-cream/\" target=\"_blank\" rel=\"noopener\"\u003eGet-A-Way Alphonso Mango Ice Cream\u003c/a\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e \u003c/p\u003e"])</script><script>self.__next_f.push([1,"98:T544,\u003cp\u003e\u003cstrong\u003e\u003cem\u003eChef Bani’s journey in baking\u003c/em\u003e\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eA physics student turned culinary artist, chef Nanda’s love for baking blossomed while watching her mother bake. While her mother Mrs. Nanda would hand-beat the batter, chef Nanda and her sister would climb to the kitchen counter and observe. Once, when their mother was making pound cake, the siblings demolished all the raw batter in one sitting, leaving  their mother with nothing to bake! Moments like these made her fall in love with baking and led to her brushing up on the best techniques at Le Cordon Bleu in Paris.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eOn returning, she opened up her patisserie in New Delhi at the young age of 24, a task that didn’t just put her cooking to the test but also her disciplinary skills. The inception of Miam Pâtisserie took place in her grandmother's old bedroom, a space that became the incubator for dreams. After all, it was her grandmother’s encouraging words that gave her the courage to overcome the pressures of switching fields as an adult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eHer mission was simple: she wanted to introduce French patisserie to a crowd unfamiliar with such delights. Let’s uncover the tools and tricks that were her partners in this journey.\u003c/span\u003e\u003c/p\u003e99:T8d1,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003eChef Bani Nanda’s kitchen essentials for baking\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003e\u003cstrong\u003e1. Lists\u003c/strong\u003e\u003cbr /\u003e\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eFirst come the lists, her holy grail. They may be the cake order lists or just daily to-dos. Chef Nanda would pin them neatly on boards. Otherwise, she would lose track of the day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e2. Small bent palette knife\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eNext comes her favourite tool - the small bent palette knife. The small tool is multi-faceted and compact. Whether you need to decorate a cake, level the layers or fix frosting blunders; this blunt knife offers the precision and control to do so. She swears by it so much that she bought all her chefs one each!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e3. Journal\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eWhile baking, mistakes could lead to some wonderful discoveries. That’s why, chef Nanda keeps a written account of all the ideas that pop into her head. “I once spilled some dacquoise batter on the tray and it baked into a lovely golden nutty crisp (more like a tuile).\u003cbr /\u003e\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe now use it as a garnish for cakes!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e4. Baking trays\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eThen come the baking trays, the tool that provides a solid, even cooking surface to the cakes. They come in different materials, shapes, sizes and thicknesses but chef Nanda’s usually weigh 1.3 kgs and are 2 mm in thickness, ideal for commercial use.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e5. Stand mixer and immersion blender\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003eAs a baker, she is also heavily dependent on her stand mixer and immersion blender. They enable her to evenly mix the ingredients of any of her recipes without spending too much time or physical effort. Plus they are easy to clean and give consistent results each time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eOverall, being organised is the key to baking like a pro! Quality bakeware and the passion to innovate and experiment go a long way for bakers. Like chef Bani, you too, could dive headfirst into the world of sweet goods and be remembered in times of celebration and happiness.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"9a:T43e,\u003cp\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eMost of us know \u003cstrong\u003e\u003ca title=\"Explore Fresh Mushrooms - Foodstories\" href=\"https://www.foodstories.shop/shop/fruits-vegetables/vegetables/mushrooms/\" target=\"_blank\" rel=\"noopener\"\u003emushrooms\u003c/a\u003e\u003c/strong\u003e as fun additions to a vegetarian meal, for adding a meaty texture and umami flavour to dishes.  But there’s so much to know about your favourite fungi. At \u003cstrong\u003e\u003ca title=\"The Premium Gourmet Grocery Store - Foodstories\" href=\"https://www.foodstories.shop/\" target=\"_blank\" rel=\"noopener\"\u003eFoodstories\u003c/a\u003e\u003c/strong\u003e, we’re pleased to point a spotlight on our partner Planet Mushroom and their innovative, forward-thinking mushroom farming. “Very few young, educated people in our country consider pursuing a career in the agricultural sector, yet, in my opinion; it is a vital industry that can greatly benefit from modernisation and innovation,” explains Naveen Patwal, the genius behind the Uttarakhand based mushroom company that specialises in  cultivating and providing a variety of fun fungi for all.\u003c/span\u003e\u003c/p\u003e9b:T49d,\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eYour company offers a variety of mushroom species. Could you highlight some of the different types you cultivate?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe specialise in cultivating both gourmet and functional mushrooms. Among the gourmet varieties, we grow a diverse selection including Agaricus bisporus species (Button, Portobello, Cremini), Shiitake, Oysters (Dhingri), King Oysters, and Lions Mane Mushrooms. \u003cbr /\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eAdditionally, we produce functional mushrooms such as Cordyceps Millitaris and Rishi. Cordyceps, Rishi, and Chaga mushrooms are prized for their earthy flavours and are renowned for their antioxidant properties and their potential benefits for gut health. Cordyceps, in particular, is valued for its ability to enhance strength and endurance.\u003cbr /\u003e\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003eOur commitment to sustainability extends to the collection of wild mushrooms from the forests of the Himalayas, including Gucchi/Morels, Chaga, Porcini, and Chanterelle Mushrooms.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e9c:T6d9,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eHow do you ensure the quality and freshness of your mushrooms from cultivation to distribution? Can you walk us through your process?\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003e \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eFirstly, our raw materials undergo meticulous selection and pass through stringent quality checks. Our in-house production of compost ensures that no chemicals are used, only sterilised compost is utilised in the growing rooms. Our dedicated facility, constructed with European technology, distinguishes us as the sole high-tech mushroom farm in India, where every production stage is computer-controlled.\u003cbr /\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe employ a selective harvesting technique, ensuring that only mushrooms of a proper size and strength are harvested. Our mushrooms undergo rigorous quality testing at labs, to certify that they are free from harmful chemicals. This serves as a testament to our commitment to sustainable practices that safeguard the ecosystem. \u003cbr /\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eOnce harvested, the mushrooms are promptly shipped in refrigerated vans to the market, to minimise temperature fluctuations.\u003cbr /\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eBy controlling the entire process internally, from compost to spawn production, we can uphold stringent standards and fine-tune environmental factors. Such attention to detail and adherence to quality standards ensure that our mushrooms reach consumers in their freshest and most nutritious state.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"9d:T7cf,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eMany people may not know how to properly store mushrooms to maintain their freshness. What are your top tips for storing mushrooms at home?\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003e \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eKeeping them in the dry, cool fridge is the best way to prolong their life along with avoiding water until the last possible second. \u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400; font-size: 16px;\"\u003eUse a paper bag to store it as it will absorb the moisture mushrooms naturally release, preventing them from getting slimy. \u003c/span\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e \u003c/p\u003e\r\n\u003cp\u003e \u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003eSustainability is a crucial aspect of your business. How do you approach sustainability in mushroom cultivation, and what efforts do you make to minimise environmental impact?\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003e \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eThe incorporation of energy-efficient HVAC (Heating, Ventilation and Air Conditioning) equipment and automated operations for filling and emptying compost are pivotal steps in enhancing sustainability within mushroom cultivation. Furthermore, our commitment to sustainability extends to the elimination of polythene usage, promoting the reuse of consumables, and adopting eco-friendly practices throughout the cultivation process. \u003cbr /\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eBy ensuring zero chemical usage in the growing process, we not only preserve the natural balance but also promote the production of mushrooms that are free from harmful chemicals. Through these sustainable practices, we aim to contribute to a healthier planet while maintaining the highest standards of quality and eco-consciousness in mushroom cultivation.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"9e:T433,\u003cp\u003e\u003cstrong\u003eLooking towards the future, what are your goals and aspirations for Planet Mushroom, both in terms of growth and impact on the industry?\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eMushrooms are among the world's foremost superfoods, boasting numerous health benefits. As people seek out nutritious and sustainable food options, mushrooms emerge as an ideal choice due to their versatility and nutritional profile. By 2025, we envision Planet Mushroom becoming the most favourable brand, offering a diverse range of gourmet and nutraceutical mushrooms and mushroom products. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eWe look forward to inspiring healthier lifestyles and contributing to a brighter, more sustainable future for all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cspan style=\"font-weight: 400;\"\u003eExplore the \u003ca title=\"Explore Mushrooms - Foodstories\" href=\"https://www.foodstories.shop/shop/fruits-vegetables/vegetables/mushrooms/?\" target=\"_blank\" rel=\"noopener\"\u003efabulous world of fungi on Foodstories\u003c/a\u003e.\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e9f:Tbf8,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cstrong\u003eAny tips, do’s and don’ts on how one can eat mindfully and incorporate more plant-based foods into their diet?\u003c/strong\u003e\u003cspan style=\"font-weight: 400;\"\u003e\u003cbr /\u003e\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003e\u003cbr /\u003eOne needs to recognize that everyone's nutritional needs are unique. Experiment with different plant-based foods to find what works best for your body, considering factors like energy levels, digestion, and overall well-being. Pay attention to how your body responds to different plant-based foods and take note of how you feel after meals. This self-awareness can help you tailor your plant-based diet to suit your individual nutritional needs.\u003c/span\u003e\u003cspan style=\"font-weight: 400;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eBe mindful of highly processed plant-based alternatives. Read labels to check for added sugars, preservatives, and other additives. Opt for products with minimal ingredients and those that align with your health goals.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eAvoid the common misconception that all vegan foods are automatically healthy. Foods like vegan pastries, fries, or sugary snacks can still be high in calories and low in essential nutrients.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eDon't compromise on nutrient density. Some plant-based foods, like leafy greens, berries, and cruciferous vegetables, are rich in vitamins, minerals, and antioxidants. Prioritise these foods to support overall health.\u003c/span\u003e\u003c/li\u003e\r\n\u003cli style=\"font-weight: 400;\" aria-level=\"1\"\u003e\u003cspan style=\"font-weight: 400;\"\u003eExperiment with different cooking methods, flavours, and cuisines to keep your plant-based meals interesting. Try new herbs and spices, explore international dishes, and introduce creativity into your cooking. Consistency in incorporating plant-based options ensures long-term success.\u003c/span\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e \u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003eThe Cinnamon Kitchen currently offers a curated range of plant-based snacks in four delicious options ,\u003cstrong\u003e\u003ca title=\"Buy The Cinnamon Kitchen Fudge - Foodstories\" href=\"https://www.foodstories.shop/shop/product/the-cinnamon-kitchen-fudge/\" target=\"_blank\" rel=\"noopener\"\u003eThe Cinnamon Kitchen Fudge\u003c/a\u003e\u003c/strong\u003e, \u003cstrong\u003e\u003ca title=\"Buy Methi Millet Crackers - Foodstories\" href=\"https://www.foodstories.shop/shop/product/the-cinnamon-kitchen-methi-millet-crackers/\" target=\"_blank\" rel=\"noopener\"\u003eMethi Millet Crackers\u003c/a\u003e\u003c/strong\u003e, \u003cstrong\u003e\u003ca title=\"Buy Spicy Vegan Cheddar Chips - Foodstories \" href=\"https://www.foodstories.shop/shop/product/the-cinnamon-kitchen-spicy-vegan-cheddar-chips/\" target=\"_blank\" rel=\"noopener\"\u003eSpicy Vegan Cheddar Chips\u003c/a\u003e\u003c/strong\u003e, and \u003cstrong\u003e\u003ca title=\"Buy Cinnamon Kitchen Cookies - Foodstories\" href=\"https://www.foodstories.shop/shop/product/cinnamon-kitchen-cookies/\" target=\"_blank\" rel=\"noopener\"\u003eCinnamon Kitchen Cookies \u003c/a\u003e\u003c/strong\u003e\u003c/em\u003e\u003cem\u003eavailable at Foodstories\u003c/em\u003e\u003cem\u003e.\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"41:[\"$\",\"$L85\",null,{\"data\":{\"articles\":[{\"id\":737,\"sku\":\"peel-slice-and-try\",\"name\":\"Peel, Slice And Try: How To Experiment With Homemade Cocktails\",\"attribute_set_id\":10,\"price\":0,\"status\":1,\"visibility\":4,\"type_id\":\"virtual\",\"created_at\":\"2024-01-15 09:50:18\",\"updated_at\":\"2025-07-01 11:16:44\",\"extension_attributes\":{\"website_ids\":[1,2],\"category_links\":[{\"position\":1,\"category_id\":\"1354\"},{\"position\":1,\"category_id\":\"471\"},{\"position\":-88,\"category_id\":\"476\"}],\"attribute_set_name\":\"stories-article\",\"canonical_url\":\"https://www.foodstories.shop/stories/article/peel-slice-and-try-how-to-experiment-with-homemade-cocktails\",\"nutrition_info\":[],\"wishlist_count\":0,\"event_hosts\":[],\"event_latitude\":\"\",\"event_longitude\":\"\",\"resolved_store_code\":\"vasantkunj\"},\"product_links\":[],\"options\":[],\"media_gallery_entries\":[{\"id\":1367,\"media_type\":\"image\",\"label\":null,\"position\":0,\"disabled\":false,\"types\":[],\"file\":\"/r/a/prd_737_0ccec0f5b8be0d10.jpg\"},{\"id\":1366,\"media_type\":\"image\",\"label\":null,\"position\":1,\"disabled\":false,\"types\":[],\"file\":\"/r/a/prd_737_63b4eedb98ec3df8.jpg\"},{\"id\":1550,\"media_type\":\"image\",\"label\":null,\"position\":2,\"disabled\":false,\"types\":[\"image\"],\"file\":\"/r/a/prd_737_d355913bf3e1e1cf.jpg\"},{\"id\":1358,\"media_type\":\"image\",\"label\":null,\"position\":3,\"disabled\":false,\"types\":[],\"file\":\"/a/d/prd_737_a53176846ef99bb9.jpeg\"},{\"id\":1359,\"media_type\":\"image\",\"label\":null,\"position\":4,\"disabled\":false,\"types\":[],\"file\":\"/i/m/prd_737_605887cc803b7e9c.jpg\"},{\"id\":6301,\"media_type\":\"image\",\"label\":null,\"position\":5,\"disabled\":false,\"types\":[],\"file\":\"/b/a/prd_737_90ce3b64d094d315.jpg\"},{\"id\":6302,\"media_type\":\"image\",\"label\":null,\"position\":6,\"disabled\":false,\"types\":[\"thumbnail\"],\"file\":\"/b/a/prd_737_e18a782ed601ce28.jpg\"},{\"id\":8895,\"media_type\":\"image\",\"label\":null,\"position\":7,\"disabled\":false,\"types\":[],\"file\":\"/b/a/prd_737_70ee1f3da84f8302.jpg\"}],\"tier_prices\":[],\"custom_attributes\":[{\"attribute_code\":\"image\",\"value\":\"/r/a/prd_737_d355913bf3e1e1cf.jpg\"},{\"attribute_code\":\"url_key\",\"value\":\"peel-slice-and-try-how-to-experiment-with-homemade-cocktails\"},{\"attribute_code\":\"page_layout\",\"value\":\"product-full-width\"},{\"attribute_code\":\"gift_message_available\",\"value\":\"2\"},{\"attribute_code\":\"banner_image\",\"value\":\"/r/a/rakshay_dhariwal_banner_2.jpg\"},{\"attribute_code\":\"meta_title\",\"value\":\"Discover Homemade Cocktails Tips \u0026 Trick With Rakshay Dhariwal\"},{\"attribute_code\":\"options_container\",\"value\":\"container2\"},{\"attribute_code\":\"sub_title\",\"value\":\"Bar owner Rakshay Dhariwal on jazzing up drinks at home\"},{\"attribute_code\":\"banner_image_mobile\",\"value\":\"/b/a/banner-47.jpg\"},{\"attribute_code\":\"banner_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"meta_description\",\"value\":\"Explore the art of crafting homemade cocktails with expert tips with Rakshay Dhariwal .Learn how to peel, slice, and mix your way to the perfect drink at home with our guide on Foodstories Shop. Enhance your cocktail-making skills today\"},{\"attribute_code\":\"description1_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"/a/d/adobestock_209622369.jpeg\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"/i/m/image_2_854x401px.jpg\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"1354\",\"471\",\"476\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"time_to_read\",\"value\":\"5-Minute Read\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"$86\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eWhat about running a bar and cocktail making do you enjoy the most?\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eCocktail making and mixology is very much an art and what is very exciting is that it has begun to incorporate a lot of science as well. What I enjoy is the evolution of cocktails and how the trends in this field keep changing. Now bars are using equipment like centrifuges and rotovaps or rotary evaporators\u003c/span\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003e \u003c/span\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eto impart new flavours and create new textures. The fact that this field has become so dynamic and diverse is what makes it a very exciting space to be in. India has never had more attention on itself as an important hub for cocktailing and it is exciting to be in this market at this point.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eWhat flavours do you enjoy in your drinks? What are the unexpected flavour combos in a cocktail that have blown your mind?\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400; font-size: 16px;\\\"\u003eWhile I think I can appreciate many different styles of cocktails, I personally really enjoy spirit-forward cocktails that celebrate the base spirit that is used and find interesting complementary ingredients. Recently, I have been enjoying savoury cocktails with unusual ingredients like seaweed and interesting takes on\u003ca title=\\\"Shop For Fresh Vegetables\\\" href=\\\"https://www.foodstories.shop/shop/fruits-vegetables/vegetables/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003e \u003cstrong\u003evegetables\u003c/strong\u003e\u003c/a\u003e like beet and bitter melon. \u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eWhat are the must-have garnishes home bartenders should be armed and ready with? How can we move beyond the standard mint and lemon garnish?\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400; font-size: 16px;\\\"\u003eDehydrated fruit wheels and whole spices make for good and aromatic garnishes. Fruit leathers are easy enough to make yet important because they allow you to use parts of \u003cstrong\u003e\u003ca title=\\\"Shop For Fresh Fruits\\\" href=\\\"https://www.foodstories.shop/shop/fruits-vegetables/fruits/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003efruits\u003c/a\u003e\u003c/strong\u003e that are otherwise being discarded.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description4\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eCan we create something interesting with just our kitchen items?\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400; font-size: 16px;\\\"\u003eAbsolutely! We can make wonderful cocktails with the \u003ca title=\\\"Shop For Fresh Fruits \u0026amp; Vegetables\\\" href=\\\"https://www.foodstories.shop/shop/fruits-vegetables/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003e\u003cstrong\u003efruits \u0026amp; vegetables\u003c/strong\u003e\u003c/a\u003e, herbs and spices from our homes. You can use star anise and cinnamon for lots of added flavour in the winters, and in the summer, fruit rind and melons and cucumbers make great garnishes. For those looking for something a little different, homemade pineapple tepache is a sustainable easy drink to make by fermenting the rind of pineapple at home.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eWhat is your personal favourite ingredient when it comes to creating a garnish? And what’s the one ingredient you can’t stand in a garnish?\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400; font-size: 16px;\\\"\u003eI am a sucker for Campari dust. I love the bitterness it imparts on a cocktail. I cannot stand garnishes that get stuck on my lips. Aesthetics aren’t everything, despite us living in an Instagram generation!\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eHow can I make a homemade cocktail look and taste nice at the same time? \u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400; font-size: 16px;\\\"\u003eThe way to do it is to first build the cocktail to ensure it is flavourful and balanced. After that, you choose the glassware and that will help figure out which garnish is best suited. Sometimes simple garnishes on contrasting colour cocktails look very elegant and sometimes a simple cocktail can be presented with lots of drama and extra character to tell its story. Everything is possible— but the key is to focus on the actual cocktail first.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003e\u003cem\u003eAnd finally, what are your at-home bartending tips that you can share with us?\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400; font-size: 16px;\\\"\u003eMake sure your bar is well stocked and try different bases in your regular cocktails. Try a Pistola Resposado old-fashioned or a dark rum Manhattan. Don’t be afraid to experiment with garnishes— take anything from your kitchen, slice and peel it and try. It may work more often than you think.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"send_to_facebook\",\"value\":\"0\"},{\"attribute_code\":\"description14_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description15_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"selection_of_the_week\",\"value\":\"0\"},{\"attribute_code\":\"description15_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description15_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"mapped_image\",\"value\":\"/b/a/banner-17_1.jpg\"},{\"attribute_code\":\"featured_article\",\"value\":\"0\"},{\"attribute_code\":\"mapped_image_mobile\",\"value\":\"/b/a/banner-18_1.jpg\"},{\"attribute_code\":\"thumbnail\",\"value\":\"/b/a/prd_737_e18a782ed abel\":null,\"position\":5,\"disabled\":false,\"types\":[],\"file\":\"/p/r/prd_738_c9d4c8092bcc4ec6.jpg\"},{\"id\":1564,\"media_type\":\"image\",\"label\":null,\"position\":6,\"disabled\":false,\"types\":[],\"file\":\"/p/r/prd_738_9d6bd67b9a945592.jpg\"},{\"id\":6303,\"media_type\":\"image\",\"label\":null,\"position\":7,\"disabled\":false,\"types\":[],\"file\":\"/b/a/prd_738_dec5c03b750e0ac9.jpg\"},{\"id\":6304,\"media_type\":\"image\",\"label\":null,\"position\":8,\"disabled\":false,\"types\":[\"thumbnail\"],\"file\":\"/b/a/prd_738_3b0766bfc5a7a5a2.jpg\"},{\"id\":8896,\"media_type\":\"image\",\"label\":null,\"position\":9,\"disabled\":false,\"types\":[],\"file\":\"/b/a/prd_738_23c89150ffe634b0.jpg\"}],\"tier_prices\":[],\"custom_attributes\":[{\"attribute_code\":\"image\",\"value\":\"/p/r/prd_738_c1f861f99bdc2e64.jpg\"},{\"attribute_code\":\"url_key\",\"value\":\"four-telltale-signs-of-good-quality-chocolate\"},{\"attribute_code\":\"page_layout\",\"value\":\"product-full-width\"},{\"attribute_code\":\"gift_message_available\",\"value\":\"2\"},{\"attribute_code\":\"banner_image\",\"value\":\"/p/r/prateek_bakhtiani_banner.jpg\"},{\"attribute_code\":\"meta_title\",\"value\":\"4 Signs of High-Quality Chocolate | Foodstories\"},{\"attribute_code\":\"options_container\",\"value\":\"container2\"},{\"attribute_code\":\"sub_title\",\"value\":\"Chef Prateek Bakhtiani unwraps the sweet standard\"},{\"attribute_code\":\"banner_image_mobile\",\"value\":\"/b/a/banner-48.jpg\"},{\"attribute_code\":\"banner_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"meta_description\",\"value\":\"Discover the key indicators of premium chocolate. Learn about texture, aroma, and more to choose the best chocolate. Expert tips for chocolate lovers.\"},{\"attribute_code\":\"description1_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"/t/e/texture_854x401px.jpg\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"/a/p/appearance_854x401px.jpg\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"471\",\"1354\",\"476\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"time_to_read\",\"value\":\"4-Minute Read\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"$89\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"\u003cp\u003e\u003cem\u003e\u003cstrong\u003eChef Bakhtiani’s chocolate philosophy\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eChocolate became Bakhtiani's medium primarily because of its versatility. According to the chef, chocolate and art involve shared techniques that elevate both disciplines to new heights of creativity such as stencilling, moulding, and airbrushing among others. Like finding the right shade of colour for a particular setting, chef Bhaktiani likens pairing chocolate with interesting ingredients that work with the flavours of each bar. Every chocolate has its nuances but some hallmarks remain for good quality chocolate.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"\u003cp\u003e\u003cem\u003e\u003cstrong\u003eSigns of good quality chocolate\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e1. Aroma\u003cbr /\u003e\u003c/strong\u003e\u003c/em\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eNext, you need to judge its aroma. Good quality chocolate will smell fruity and earthy, like the aroma of the cocoa fruit, rather than burnt and sugary.\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e2. Appearance\u003cbr /\u003e\u003c/strong\u003e\u003c/em\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eFirst and foremost, you need to observe how the chocolate looks. It should be smooth with a sheen that indicates it was tempered correctly. Air bubbles or cracks may indicate incorrect storage or tempering techniques. Look out for that lovely brown “chocolate” colour as well.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003cp\u003e\u003cem\u003e\u003cstrong\u003e3. Taste\u003cbr /\u003e\u003c/strong\u003e\u003c/em\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eAs soon as you bite into good quality chocolate, it should feel smooth and velvety with a rich taste with floral or fruity undertones from the cocoa it’s made from. It should allow other flavours to come through.\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e4. Texture\u003cbr /\u003e\u003c/strong\u003e\u003c/em\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eQuality chocolate made with cocoa butter will melt evenly in your hands and mouth. If it feels grainy or waxy, it most likely has high vegetable fat content. Additionally, the chocolate should snap cleanly when broken in half rather than bending or crumbling.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description4\",\"value\":\"$8a\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image2\",\"value\":\"no_selection\"},{\"attrib bad7596689.jpg\"},{\"id\":1563,\"media_type\":\"image\",\"label\":null,\"position\":3,\"disabled\":false,\"types\":[\"thumbnail\"],\"file\":\"/p/r/prd_836_253d7ad7781925c2.jpg\"},{\"id\":8899,\"media_type\":\"image\",\"label\":null,\"position\":4,\"disabled\":false,\"types\":[],\"file\":\"/b/a/prd_836_753dba93c5a2dbb5.jpg\"}],\"tier_prices\":[],\"custom_attributes\":[{\"attribute_code\":\"image\",\"value\":\"/p/r/prd_836_0d829e3e4fb6befd.jpg\"},{\"attribute_code\":\"url_key\",\"value\":\"koji-koo-up-close-and-funky-with-brown-koji-boy\"},{\"attribute_code\":\"page_layout\",\"value\":\"product-full-width\"},{\"attribute_code\":\"gift_message_available\",\"value\":\"2\"},{\"attribute_code\":\"banner_image\",\"value\":\"/p/r/prachet_sancheti_banner.jpg\"},{\"attribute_code\":\"meta_title\",\"value\":\"Discover Koji with Brown Koji Boy: Flavor \u0026 Nutrition Boost\"},{\"attribute_code\":\"options_container\",\"value\":\"container2\"},{\"attribute_code\":\"sub_title\",\"value\":\"Get to know Prachet Sancheti, the creative genius helping India embrace koji, one bite at a time\"},{\"attribute_code\":\"banner_image_mobile\",\"value\":\"/b/a/banner-42.jpg\"},{\"attribute_code\":\"banner_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"meta_description\",\"value\":\"Meet Prachet Sancheti, the koji enthusiast transforming Indian cuisine with this versatile ferment. Explore unique koji-infused products and learn tips for using and storing koji at home.\\\"\"},{\"attribute_code\":\"banner_video_mobile\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"471\",\"1354\",\"476\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"time_to_read\",\"value\":\"6 Minutes\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"$8b\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"\u003cp\u003e\u003cstrong\u003eWhat was your first exposure to fermentation and specifically koji?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eIt all began in the kitchen of a restaurant called Dirt Candy in New York in 2019. During prep, I used to make a bunch of pickles and some lacto-ferments from veggie scraps and from there onwards I enjoyed the fermentation process and flavours and kept playing with it at home. Koji came into the picture when I was attending a Culinary Arts course at the University of Gastronomic Sciences in Italy. It was the first time I touched and tasted koji. Life wasn’t the same \u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"$8c\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003cp\u003e\u003cstrong\u003eWhat was the inspiration for starting a business that centres around koji?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eWell, koji had received a fair bit of attention abroad and people in India were not really exposed to its magic. Observing its limited use mainly in fine-dining establishments sparked the idea to bridge this gap and tap into a broader customer base. The primary goal became making koji-based ferments more accessible, ensuring their integration into diverse restaurant menus and cuisines that cater to the adaptable Indian palate.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description4\",\"value\":\"$8d\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5\",\"value\":\"\u003cp\u003e\u003cstrong\u003eAny do’s and don’ts of dealing with and storing koji?\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eKoji, like any other food product, can go bad, but it typically has a relatively long shelf life if stored properly. Here are a few tips:\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eStore in a cool, dry place. I recommend the fridge or freezer. Always use airtight containers.\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eSmell generally is a good indicator to tell if koji has gone bad. Also if you spot any mould or unfamiliar growth on top, that’s a giveaway too. \u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eExperiment with different ingredients: koji is versatile and can be used to ferment a variety of ingredients. Experiment with different grains, beans, or other substrates to discover unique flavours and textures.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6\",\"value\":\"\u003cp style=\\\"text-align: center;\\\"\u003e\u003cstrong\u003e\u003cem\u003eExplore Brown Koji Boy’s range of condiments here\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"send_to_facebook\",\"value\":\"0\"},{\"attribute_code\":\
