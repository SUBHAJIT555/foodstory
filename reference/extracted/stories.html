lse,\"types\":[],\"file\":\"/b/a/prd_833_fc216e943d154268.jpg\"},{\"id\":6306,\"media_type\":\"image\",\"label\":null,\"position\":2,\"disabled\":false,\"types\":[\"thumbnail\"],\"file\":\"/b/a/prd_833_1942d772c0afa317.jpg\"},{\"id\":8897,\"media_type\":\"image\",\"label\":null,\"position\":3,\"disabled\":false,\"types\":[],\"file\":\"/b/a/prd_833_28a60d1d2b0c15c7.jpg\"},{\"id\":1542,\"media_type\":\"image\",\"label\":null,\"position\":4,\"disabled\":false,\"types\":[],\"file\":\"/y/a/prd_833_e36fd3db73e542f3.jpg\"},{\"id\":1543,\"media_type\":\"image\",\"label\":null,\"position\":5,\"disabled\":false,\"types\":[],\"file\":\"/y/a/prd_833_444d402de32258f3.jpg\"},{\"id\":10819,\"media_type\":\"image\",\"label\":null,\"position\":6,\"disabled\":false,\"types\":[],\"file\":\"/w/e/prd_833_befcc8ec9effb264.jpg\"}],\"tier_prices\":[],\"custom_attributes\":[{\"attribute_code\":\"image\",\"value\":\"/y/a/prd_833_f9addaf9758b08be.jpg\"},{\"attribute_code\":\"url_key\",\"value\":\"coffee-is-so-much-more-than-a-lazy-morning-hack\"},{\"attribute_code\":\"page_layout\",\"value\":\"product-full-width\"},{\"attribute_code\":\"gift_message_available\",\"value\":\"2\"},{\"attribute_code\":\"banner_image\",\"value\":\"/y/a/yahvi_mariwala_banner.jpg\"},{\"attribute_code\":\"meta_title\",\"value\":\"From Bean to Brew: Coffee Tips from Yahvi Mariwala of Nandanvan Estate | Foodstories\"},{\"attribute_code\":\"options_container\",\"value\":\"container2\"},{\"attribute_code\":\"sub_title\",\"value\":\"Coffee entrepreneur Yahvi Mariwala spills the beans on why you should care more about coffee and how to brew that perfect cup\"},{\"attribute_code\":\"banner_image_mobile\",\"value\":\"/b/a/banner-45.jpg\"},{\"attribute_code\":\"banner_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"meta_description\",\"value\":\"From roast types to tasting notes, Yahvi Mariwala of Nandan Coffee breaks down how to choose—and brew—the right coffee.\"},{\"attribute_code\":\"description1_image1\",\"value\":\"/y/a/yahvi_decription_1.jpg\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"471\",\"1354\",\"476\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"/y/a/yahvi_decription_2.jpg\"},{\"attribute_code\":\"time_to_read\",\"value\":\"7–Minute Read\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"$8e\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"$8f\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eWhat does coffee mean to you?\u003c/em\u003e \u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003e\u003cstrong\u003e\u003ca title=\\\"Explore Coffee Types - Foodstories \\\" href=\\\"https://www.foodstories.shop/shop/tea-coffee-beverages/coffee/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eCoffee\u003c/a\u003e\u003c/strong\u003e is all about experiences for me. It’s my memory of being at the estate with my grandparents and sipping on a French press coffee while reading or going to a great café and interacting with really passionate people behind the scenes. It’s walking through the Nandanvan Estate and seeing the coffee plants during flowering season and the entire valley covered in a sea of white flowers. The brilliance of coffee is that it helps enhance and create experiences every day, through every cup. So there’s no one memory per se, it’s more about coffee being a constant companion for me.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eTell us something that people usually don’t think about when it comes to their cup of coffee.\u003c/em\u003e \u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eCoffee has long been seen as a commodity product or a quick fix to a lazy morning. But coffee is so much more than that. There’s so much labour that goes into creating an amazing cup of coffee that starts from the soil and seeds and goes all the way to the barista and the type of cup they chose to serve the coffee in. There are so many hands that this product passes through before it reaches the consumer, and when it is a truly amazing cup, you see the effort that people throughout the supply chain put in to make this a reality. This is what the specialty coffee industry and movement is also trying to highlight, to change people’s perspective of coffee as just another commodity and highlight its nuances.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description4\",\"value\":\"$90\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5\",\"value\":\"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eHow does one pick the right roast for them?\u003c/em\u003e\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eYou can also look at the tasting notes mentioned on the coffee roasts, which can give you a really good idea of what to expect. For instance, if a packet says it’s blueberry coffee, it might not taste exactly like a blueberry, but you know that blueberry has a very bright, sweet flavour so those are the tasting notes to look out for.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6\",\"value\":\"$91\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7\",\"value\":\"\u003cp\u003e\u003cem\u003e\u003cstrong\u003eHow does one tell a good cup from a bad one?\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eYes, a few things to look out for are  \u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eFermented tastes: If the coffee has not been processed properly or has fermented and come in contact with another batch of coffee, then the coffee will taste like rotten, spoilt fruit in your final cup. \u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eIf your coffee is too bitter, then it might be because it's been extremely light-roasted, or because the coffee was harvested when it was too green.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8\",\"value\":\"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eAccording to you, what are the do’s and don'ts when it comes to brewing that perfect cup?\u003c/em\u003e\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eDon’t overheat your water, because that loses a lot of the flavour. Clean your equipment, because coffee has oils and if your equipment is dirty, then that taste will also come in your final cup.  A big tip is to not store your coffee in the freezer. While most people tend to do this, it only works if you’re brewing the whole batch to be frozen and if it’s frozen in a vacuumed, sealed container. Otherwise, if your coffee is in an airtight container, then that would work as well. \u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description9_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9\",\"value\":\"$92\"},{\"attribute_code\":\"description10_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description12_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description13_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description14_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"d ,{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eBaking, often considered both an art and a science, requires not only skill but also the right tools and passion. The person who probably understands this philosophy more than most is \u003cstrong\u003e\u003ca title=\\\"View Chef Bani Nanda - Instagram Profile\\\" href=\\\"https://www.instagram.com/chefbani/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003echef Bani Nanda\u003c/a\u003e\u003c/strong\u003e, the driving force behind Delhi’s Miam Pâtisserie and the internet’s go-to chef for cookware and dinnerware recommendations.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"$98\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eFirst thing’s first: Set up the kitchen\u003c/em\u003e\u003cbr /\u003e\u003c/strong\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eBefore she begins, chef Nanda makes sure her kitchen is sparkling and organised. She lays some of her favourite nozzles, piping bags, kitchen seers, a paring knife, a bread knife, a chef’s knife, rubber spatulas, bent palette knives, tweezers, whisks and spoons laid out in a tray on a bed of kitchen roll and then begins.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"$99\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image1 e,\"types\":[],\"file\":\"/i/m/prd_1348_09130881a50a4ebb.jpg\"},{\"id\":2216,\"media_type\":\"image\",\"label\":null,\"position\":5,\"disabled\":false,\"types\":[],\"file\":\"/i/m/prd_1348_2186271b472e80fa.jpg\"}],\"tier_prices\":[],\"custom_attributes\":[{\"attribute_code\":\"image\",\"value\":\"/n/a/prd_1348_759004282f1b7ab5.jpg\"},{\"attribute_code\":\"url_key\",\"value\":\"morel-of-the-story-in-conversation-with-planet-mushroom\"},{\"attribute_code\":\"page_layout\",\"value\":\"product-full-width\"},{\"attribute_code\":\"gift_message_available\",\"value\":\"2\"},{\"attribute_code\":\"banner_image\",\"value\":\"/n/a/naveen_patwal_banner.jpg\"},{\"attribute_code\":\"meta_title\",\"value\":\"Mushrooming Innovations with Planet Mushroom\"},{\"attribute_code\":\"options_container\",\"value\":\"container2\"},{\"attribute_code\":\"sub_title\",\"value\":\"Get to know Foodstories’ partner to explore their sustainable mushroom farming techniques and how they are leaving no (mush) room for error.\"},{\"attribute_code\":\"banner_image_mobile\",\"value\":\"/b/a/banner-41.jpg\"},{\"attribute_code\":\"banner_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"meta_description\",\"value\":\"Explore sustainable, chemical free mushroom farming with Planet Mushroom, where tech meets tradition for fresh, nutritious fungi.\"},{\"attribute_code\":\"banner_video_mobile\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image1\",\"value\":\"/i/m/image_1.jpg\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"/i/m/image_2.jpg\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"471\",\"1354\",\"476\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"time_to_read\",\"value\":\"5-Minute Read\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"$9a\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cstrong\u003eCan you share the origin story of your  company? What inspired you to venture into the world of mushroom cultivation?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-size: 16px;\\\"\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eMushroom cultivation is an intriguing field that demands both practical skills and scientific knowledge. Driven by my passion for technology, I utilise my technical expertise in computer engineering to make a meaningful impact in the agricultural sector. Despite its high risk, I embraced the opportunity and chose the unconventional path. We began with a daily production of 1 ton of button mushrooms in 2009, and today, we have expanded manifolds, cultivating a variety of mushrooms. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"$9b\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003cp\u003e\u003cstrong\u003eWhy should one incorporate mushrooms into their diet?\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eHistorically, mushrooms have been referred to as the \\\"Food of God,\\\" and in certain cultures, they were even referred to as the \\\"elixir of immortality.\\\" In recent times, modern science has begun to recognise the importance of mushrooms due to their potent health benefits. \u003cbr /\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eThe mushroom cellular structure contains chitin, which resembles that of animals, enabling them to mimic meat textures effectively. They serve as an excellent source of vitamin D and have a low glycemic index. This means that consuming mushrooms does not cause significant spikes in blood sugar levels, making them a favourable inclusion in diabetic diets.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description4\",\"value\":\"$9c\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5\",\"value\":\"$9d\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6\",\"value\":\"$9e\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\" uct-full-width\"},{\"attribute_code\":\"gift_message_available\",\"value\":\"2\"},{\"attribute_code\":\"banner_image\",\"value\":\"/p/r/priyasha_banner.jpg\"},{\"attribute_code\":\"meta_title\",\"value\":\"Healthy Snacking with The Cinnamon Kitchen\"},{\"attribute_code\":\"options_container\",\"value\":\"container2\"},{\"attribute_code\":\"sub_title\",\"value\":\"The Cinnamon Kitchen’s  Priyasha Saluja on her journey to make healthy, PCOS-snacking accessible to all \"},{\"attribute_code\":\"banner_image_mobile\",\"value\":\"/b/a/banner-44.jpg\"},{\"attribute_code\":\"banner_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"meta_description\",\"value\":\"Discover Priyasha Saluja’s gluten-free, PCOS-friendly snacks born from her journey to make mindful eating easy and delicious for everyone.\"},{\"attribute_code\":\"banner_video_mobile\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image1\",\"value\":\"/t/c/tck-_image_1_854x401px_.jpg\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"1354\",\"476\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"/t/c/tck-_image_2_854x401px_.jpg\"},{\"attribute_code\":\"time_to_read\",\"value\":\"7–Minute Read\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eA PCOS diagnosis at the age of 13 led \u003cstrong\u003e\u003ca title=\\\"Priyasha Saluja - LinkedIn \\\" href=\\\"https://in.linkedin.com/in/priyashasaluja\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003ePriyasha Saluja\u003c/a\u003e\u003c/strong\u003e on a journey of mindful eating. Since then, she hasn’t looked back. “\u003c/span\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eI couldn’t find ready-to-eat snacks in the market that were suited to my dietary requirements, and so I started experimenting with recipes in my home kitchen.” \u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eWhat started as an Instagram page to showcase Priyansha’s creations quickly turned into an entrepreneurial venture that exploded across the country, to meet the growing demand during the pandemic. \u003c/span\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eThus was born The Cinnamon Kitchen, dedicated to creating healthy, gluten-free, PCOS-friendly snacks for all. Read on to know how the perfect crunch landed them a Shark Tank deal and many more dedicated customers. \u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"\u003cp\u003e\u003cstrong\u003eWhat was your inspiration to start Cinnamon Kitchen? Could you tell us about how it began?\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eAfter I was diagnosed with PCOS when I was 13, I started experimenting with recipes in my home kitchen. I began incorporating healthier ingredients in my diet including millets, nuts and good fats while eliminating sugar, gluten and dairy at the same time. I prepared my own meals and shared this journey through my Instagram handle. As a result,  I realised that many people were struggling with similar issues. As time passed, I got requests and orders from my followers who were looking for something healthy to incorporate in their diet plans. This is how The Cinnamon Kitchen was born. \u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"\u003cp\u003e\u003cstrong\u003eWe love the name of your brand. How did you come up with it?\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eA sprinkle of cinnamon reduces the glycemic index of anything that you're eating. Cinnamon may help support blood sugar management by increasing insulin sensitivity, decreasing blood sugar levels after eating, and reducing the risk of diabetes-related complications.\u003cbr /\u003e\u003c/span\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eThe key to good health is controlling and monitoring your blood sugar levels. Hence,\u003c/span\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eThe Cinnamon Kitchen, where all recipes are curated so as to reduce the insulin spike in your bloodstream and are good for you. \u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003cp\u003e\u003cstrong\u003eTell us about your range of products- how did you go about developing the range and how did you perfect the recipes without having a background in food?\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eI have always been fond of food. The knowledge for the base ideas of our range came from the West. I switched the basic ingredients of these recipes with millets which are naturally gluten-free, and grow in less nutrient-dense soil. With time, we brought in  chefs to work on more products while perfecting the older ones based on customer feedback.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description4\",\"value\":\"\u003cp\u003e\u003cstrong\u003eIs it difficult to develop recipes that are completely plant-based?\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eCreating plant-based recipes requires a completely different approach compared to traditional ones. Instead of merely substituting ingredients, it involves adopting an entirely new approach to pastry and cooking. In the absence of traditional elements, plant-based recipes may require innovative techniques and ingredient combinations. This can be initially challenging, but once a chef or home cook becomes familiar with how plant-based ingredients work harmoniously with each other, the process becomes more intuitive.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5\",\"value\":\"\u003cp\u003e\u003cstrong\u003eHow did changes in dietary preferences over the pandemic correlate to the growth and popularity of your brand?\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eThe global health crisis raised awareness about the importance of a healthy lifestyle, emphasising the link between diet and immunity. In response, the food industry adapted by offering healthier alternatives, forcing brands to reevaluate and introduce more nutritious options. The pandemic showcased the influential role of customer demand, driving industries to prioritise and innovate in the domain of health-focused products. Our brand's growth and popularity were positively influenced by aligning with these evolving consumer preferences and providing products that catered to mindful and health-conscious eating.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6\",\"value\":\"\u003cp\u003e\u003cstrong\u003eTell us about your decision to get on Shark Tank and how that impacted your business.\u003c/strong\u003e\u003c/p\u003e\\r\\n\u003cp\u003e\u003cspan style=\\\"font-weight: 400;\\\"\u003eWhen I decided to go to Shark Tank to raise funds, I wasn’t sure if I would get the money. But I was sure I would get a platform to represent my brand to the entire nation. Luckily , we closed a deal with Aman and the business has been growing. More people recognise the brand now and are becoming a part of this journey. Ever since the episode aired, there have been tremendous conversions. Currently, we are at a 4X pace and it’s still increasing.\u003c/span\u003e\u003c/p\u003e\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7\",\"value\":\"$9f\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image2\ e_code\":\"meta_description\",\"value\":\"The Manuka Miracle \"},{\"attribute_code\":\"banner_video_mobile\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"msrp_display_actual_price_type\",\"value\":\"0\"},{\"attribute_code\":\"tax_class_id\",\"value\":\"0\"},{\"attribute_code\":\"description1_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"required_options\",\"value\":\"0\"},{\"attribute_code\":\"category_ids\",\"value\":[\"476\",\"1354\"]},{\"attribute_code\":\"description3_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"has_options\",\"value\":\"0\"},{\"attribute_code\":\"author\",\"value\":\"By Team Foodstories\"},{\"attribute_code\":\"description4_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"time_to_read\",\"value\":\"5-Minute Read\"},{\"attribute_code\":\"description4_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"short_description\",\"value\":\"\u003cp data-start=\\\"252\\\" data-end=\\\"676\\\"\u003eManuka honey has become a global sensation, and for good reason. This lush golden nectar comes from the Manuka bush, native to New Zealand and parts of Australia. The flowers bloom for only a few short weeks each year, making the honey rare and highly prized. Its deep amber colour and luxuriously thick texture set it apart from regular honey, and one spoonful reveals flavours that are earthy with a mild bittersweet edge.\u003c/p\u003e\\r\\n\u003ch2 data-start=\\\"678\\\" data-end=\\\"719\\\"\u003e \u003c/h2\u003e\\r\\n\u003ch2 data-start=\\\"678\\\" data-end=\\\"719\\\"\u003e \u003c/h2\u003e\"},{\"attribute_code\":\"description4_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description1\",\"value\":\"\u003ch2 style=\\\"font-size: 28px; font-weight: bold; margin-top: 15px; margin-bottom: 15px; color: #222;\\\" data-start=\\\"1222\\\" data-end=\\\"1466\\\"\u003eThe Science Behind Its Healing Power\u003c/h2\u003e\\r\\n\u003cp data-start=\\\"252\\\" data-end=\\\"676\\\"\u003eThe real reasons for its popularity go far beyond taste. Manuka honey contains a naturally occurring antibacterial compound called methylglyoxal, also known as MGO. This powerful component gives Manuka honey the ability to assist in wound healing, fight harmful bacteria and support the immune system more effectively than standard honey. Its anti-inflammatory and restorative properties have also made it an important ingredient in skincare, wellness and natural healing.\u003c/p\u003e\\r\\n\u003ch2 data-start=\\\"678\\\" data-end=\\\"719\\\"\u003e \u003c/h2\u003e\"},{\"attribute_code\":\"description5_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description5_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description2\",\"value\":\"\u003ch2 style=\\\"font-size: 28px; font-weight: bold; margin-top: 15px; margin-bottom: 15px; color: #222;\\\" data-start=\\\"1222\\\" data-end=\\\"1466\\\"\u003eWhy Chefs Love Manuka Honey\u003c/h2\u003e\\r\\n\u003cp data-start=\\\"720\\\" data-end=\\\"1192\\\"\u003eManuka honey has a devoted following among culinary enthusiasts as well. Its complex sweetness pairs beautifully with an array of flavours. Use it as a natural alternative to sugar, drizzle it over yoghurt, swirl it into soothing herbal teas or spread it onto warm toast for a satisfying and indulgent treat. Its depth of flavour adds something truly special to both sweet and savoury dishes.\u003c/p\u003e\\r\\n\u003ch2 data-start=\\\"1194\\\" data-end=\\\"1226\\\"\u003e \u003c/h2\u003e\"},{\"attribute_code\":\"description5_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description3\",\"value\":\"\u003ch2 style=\\\"font-size: 28px; font-weight: bold; margin-top: 15px; margin-bottom: 15px; color: #222;\\\" data-start=\\\"1222\\\" data-end=\\\"1466\\\"\u003eBringing Manuka Honey Home\u003c/h2\u003e\\r\\n\u003cp\u003eWhether you are drawn to its health benefits or its gourmet potential, Manuka honey is a pantry essential worth exploring. Its rare origin, healing properties and luxurious taste make it a standout ingredient that elevates everyday dishes and natural wellness routines.\u003c/p\u003e\\r\\n\u003cp\u003eShop here to explore the many marvels of Manuka honey.\u003c/p\u003e\\r\\n\u003ch2 data-start=\\\"1621\\\" data-end=\\\"1652\\\"\u003e \u003c/h2\u003e\"},{\"attribute_code\":\"description6_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description6_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description7_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description8_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description9_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_image2\",\"value\":\"no_selection\"},{\"attribute_code\":\"description10_video\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image1\",\"value\":\"no_selection\"},{\"attribute_code\":\"description11_image2\",\"value\":\"
